  document.querySelectorAll('[data-orps]').forEach(b=>b.onclick=()=>{b.disabled=true;onlineThrow(b.dataset.orps)});
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>rpsChoose(b.dataset.role));
  document.querySelectorAll('[data-orole]').forEach(b=>b.onclick=()=>{b.disabled=true;onlineRole(b.dataset.orole)});
  on('rpsReady',()=>{RPS.pass=false;render()});on('rpsAiGo',()=>rpsChoose(RPS.aiRole));
  on('openCampaign',()=>{phase='campaign';CAMP.sel=Math.max(0,CAMPAIGN.findIndex((L,i)=>unlocked(i)&&!(CAMP.prog[i]&&CAMP.prog[i][CAMP.diff])));if(!unlocked(CAMP.sel))CAMP.sel=0;render();syncCampaign()});
  on('campBack',()=>{leaveCampaign();phase='start';G=previewGame();render()});
  document.querySelectorAll('[data-camp]').forEach(b=>b.onclick=()=>{CAMP.sel=+b.dataset.camp;render()});
  document.querySelectorAll('[data-set^="cdiff:"]').forEach(b=>b.onclick=()=>{CAMP.diff=b.dataset.set.split(':')[1];render()});
  on('campGo',startCampaign);
  on('campRetry',startCampaign);
  on('campNext',()=>{CAMP.sel=M.campResult.next;startCampaign()});
  on('campMap',()=>{phase='campaign';G=previewGame();render()});
}


// ===== Tournaments: brackets, round robin, spectating, replays =====
const PACES=[['quick','Quick',10*60e3,'10 min to start each match'],['hour','Standard',60*60e3,'1 hour to start each match'],['day','Relaxed',24*3600e3,'24 hours to start each match']];
const TOUR={list:null,listErr:'',tid:null,d:null,unsub:null,names:{},err:'',busy:false,alerted:'',form:{name:'',size:8,type:'bracket',early:'bo3',final:'bo5',rr:'bo3',pace:'hour'},rep:null,spec:{text:false},tick:null};
const ROMAN=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV'];
const paceOf=d=>PACES.find(p=>p[0]===d.pace)||PACES[1];
const fmtBo=f=>({single:'Single battle',bo3:'Best of 3',bo5:'Best of 5',bo7:'Best of 7'})[f]||f;
const tName=id=>id?(TOUR.names[id]||(id===ON.me?'You':'Player')):'—';
async function loadNames(ids){ids=[...new Set(ids.filter(id=>id&&!(id in TOUR.names)))];if(!ids.length||!ON.user||!ON.user.profiles)return;
  try{const ps=await ON.user.profiles(ids);let ch=false;for(const id of ids){const n=(ps&&ps[id]&&ps[id].name)||'';TOUR.names[id]=n||'Player';ch=true}if(ch&&(phase==='tour'||phase==='tours'))render()}catch(e){}}
function fmtLeft(ms){const a=Math.abs(ms),m=Math.round(a/60e3);if(m<60)return `${m} min`;const h=Math.floor(m/60);if(h<24)return `${h} h ${m%60} min`;return `${Math.round(h/24)} d`}
function tourCode(){let c='';for(let k=0;k<5;k++)c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return c}

// ---- structure (computed from the doc; only results are stored) ----
function seedOrder(n){let s=[1,2];while(s.length<n){const m=s.length*2;s=s.flatMap(x=>[x,m+1-x])}return s}
function bracketRounds(d){return Math.log2(d.size)}
function slotsR1(d){const seeds=d.order||[];return seedOrder(d.size).map(sd=>seeds[sd-1]||null)}
function rrRounds(d){const P=(d.order||[]).slice();if(P.length%2)P.push(null);const n=P.length,rounds=[];let arr=P.slice();
  for(let r=0;r<n-1;r++){const ms=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];if(a&&b)ms.push([a,b])}rounds.push(ms);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}return rounds}
// players of a bracket match: uid, null = bye, undefined = not decided yet
function bMatch(d,r,k){const id=`R${r}M${k}`,rec=(d.matches||{})[id]||{},R=bracketRounds(d);const bo=r===R?d.final:d.early;
  let p,ready;
  if(r===1){const s=slotsR1(d);p=[s[2*k],s[2*k+1]];ready=d.startedAt||null}
  else{const A=bMatch(d,r-1,2*k),B=bMatch(d,r-1,2*k+1);p=[A.winner,B.winner];ready=A.doneAt!=null&&B.doneAt!=null?Math.max(A.doneAt,B.doneAt):null}
  const m={id,r,k,p,bo,rec,ready,winner:undefined,doneAt:null,status:'waiting'};
  if(rec.winner!==undefined&&rec.winner!==null){m.winner=rec.winner;m.doneAt=rec.doneAt||ready;m.status=rec.forfeit?'forfeit':'done'}
  else if(p[0]===null&&p[1]===null&&ready!=null){m.winner=null;m.doneAt=ready;m.status='bye'}
  else if(ready!=null&&(p[0]===null||p[1]===null)&&p[0]!==undefined&&p[1]!==undefined){m.winner=p[0]||p[1];m.doneAt=ready;m.status='bye'}
  else if(p[0]&&p[1]&&ready!=null){m.status=rec.room?'live':'ready';m.deadline=ready+paceOf(d)[2]}
  return m}
function allMatches(d){if(!d.startedAt)return[];const out=[];
  if(d.type==='rr'){const st=d.startedAt,w=paceOf(d)[2];rrRounds(d).forEach((ms,ri)=>ms.forEach(([a,b])=>{const id=`RR-${a}-${b}`,rec=(d.matches||{})[id]||{};
      const m={id,r:ri+1,p:[a,b],bo:d.rr,rec,ready:st+ri*w,deadline:st+(ri+1)*w,winner:undefined,status:rec.room?'live':'ready'};
      if(rec.winner!==undefined&&rec.winner!==null){m.winner=rec.winner;m.status=rec.forfeit?'forfeit':'done'}else if(rec.void){m.winner=null;m.status='void'}
      out.push(m)}));return out}
  const R=bracketRounds(d);for(let r=1;r<=R;r++)for(let k=0;k<d.size/2**r;k++)out.push(bMatch(d,r,k));return out}
function findMatch(d,id){return allMatches(d).find(m=>m.id===id)}
function standings(d){const S={};for(const id of d.order||[])S[id]={id,w:0,l:0,rw:0,rl:0};
  for(const m of allMatches(d)){if(m.winner===undefined||m.winner===null)continue;const lo=m.p[0]===m.winner?m.p[1]:m.p[0];S[m.winner].w++;S[lo].l++;
    const sc=m.rec.score||[0,0],wi=m.p[0]===m.winner?0:1;S[m.winner].rw+=sc[wi];S[m.winner].rl+=sc[1-wi];S[lo].rw+=sc[1-wi];S[lo].rl+=sc[wi]}
  return Object.values(S).sort((a,b)=>b.w-a.w||(b.rw-b.rl)-(a.rw-a.rl)||b.rw-a.rw)}
function champion(d){if(!d.startedAt)return null;if(d.type==='rr'){const ms=allMatches(d);if(ms.some(m=>m.winner===undefined))return null;return(standings(d)[0]||{}).id||null}
  const f=bMatch(d,bracketRounds(d),0);return f.winner||null}
const overdue=m=>m.deadline&&Date.now()>m.deadline&&(m.status==='ready'||m.status==='live');

// ---- list / create / join ----
async function openTours(){phase='tours';TOUR.listErr='';render();
  try{const s=await ON.db.collection('tournaments').get();TOUR.list=s.docs.map(x=>x.data()).filter(Boolean).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    loadNames(TOUR.list.map(t=>t.creator))}catch(e){TOUR.listErr='Couldn\'t load tournaments.'}if(phase==='tours')render()}
async function createTour(){const f=TOUR.form;const nm=(($('tName')||{}).value||'').trim().slice(0,40)||'Vanquish Cup';f.name=nm;
  if(f.type==='rr'&&f.size>8)f.size=8;const code=tourCode();
  const doc={v:1,id:code,name:nm,creator:ON.me,size:f.size,type:f.type,early:f.early,final:f.final,rr:f.rr,pace:f.pace,createdAt:Date.now(),startedAt:null,players:{[ON.me]:Date.now()},order:null,matches:{}};
  TOUR.busy=true;render();try{await ON.db.doc('tournaments/'+code).set(doc);TOUR.busy=false;openTour(code)}catch(e){TOUR.busy=false;TOUR.listErr='Couldn\'t create the tournament. You need edit access to this page.';render()}}
function openTour(tid){if(TOUR.unsub)TOUR.unsub();TOUR.tid=tid;TOUR.d=null;TOUR.err='';phase='tour';render();
  TOUR.unsub=ON.db.doc('tournaments/'+tid).onSnapshot(s=>{if(!s.exists){TOUR.err='This tournament no longer exists.';TOUR.d=null;render();return}
    TOUR.d=s.data();const d=TOUR.d;if(ON.me&&champion(d)===ON.me)grant('champion');loadNames(Object.keys(d.players||{}).concat([d.creator]));tourAlert();if(phase==='tour')render()},()=>{TOUR.err='Lost the connection to this tournament.';render()});
  clearInterval(TOUR.tick);TOUR.tick=setInterval(()=>{if(phase==='tour'&&!OV.report&&!OV.settings)render()},30e3)}
function closeTour(){if(TOUR.unsub)TOUR.unsub();TOUR.unsub=null;clearInterval(TOUR.tick);TOUR.tid=null;TOUR.d=null;document.title=BASE_TITLE}
async function tourJoin(){const d=TOUR.d;if(!d||d.startedAt)return;if(Object.keys(d.players||{}).length>=d.size){TOUR.err='This tournament is full.';render();return}
  try{await ON.db.doc('tournaments/'+d.id).update({players:{[ON.me]:Date.now()}})}catch(e){TOUR.err='Couldn\'t join. You need edit access to this page.';render()}}
async function tourLeave(){const d=TOUR.d;if(!d||d.startedAt)return;try{await ON.db.doc('tournaments/'+d.id).update({players:{[ON.me]:null}})}catch(e){}}
async function tourStart(){const d=TOUR.d;if(!d||d.startedAt||d.creator!==ON.me)return;const ids=Object.keys(d.players||{}).filter(k=>d.players[k]);
  if(ids.length<2){TOUR.err='You need at least 2 players.';render();return}
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}
  try{await ON.db.doc('tournaments/'+d.id).update({order:ids,startedAt:Date.now()})}catch(e){TOUR.err='Couldn\'t start. Try again.';render()}}

// ---- playing a match ----
const roomFor=(d,m)=>`${d.id}-${m.id}`.replace(/[^A-Za-z0-9_-]/g,'');
async function tourPlay(mid){const d=TOUR.d,m=findMatch(d,mid);if(!m||!m.p.includes(ON.me))return;const side=m.p[0]===ON.me?0:1,code=roomFor(d,m);
  try{const now=Date.now();await ON.db.doc('tournaments/'+d.id).update({matches:{[mid]:{here:{[ON.me]:now},...(m.rec.room?{}:{room:code,startedAt:now})}}});
    const ref=ON.db.doc('games/'+code),s=await ref.get();
    if(!s.exists){const doc=freshDoc(code,{'0':m.p[0],'1':m.p[1]},0,false,{format:m.bo,armyRule:'loser',rps:true});doc.tour={tid:d.id,mid,name:d.name};await ref.set(doc)}
    const tid=d.id;closeTour();ON.tourBack=tid;ON.spectate=false;await enterRoom(code,side)}
  catch(e){TOUR.err='Couldn\'t open the match room. Try again.';render()}}
function tourWatch(mid){FX.threats=false;const d=TOUR.d,m=findMatch(d,mid);if(!m||!m.rec.room)return;const tid=d.id;closeTour();ON.tourBack=tid;ON.spectate=true;TOUR.spec.text=false;enterRoom(m.rec.room,null)}
async function tourClaim(mid,how){const d=TOUR.d,m=findMatch(d,mid);if(!m||!overdue(m))return;const here=m.rec.here||{};let rec;
  if(how==='forfeit'){if(!here[ON.me]||here[m.p[0]===ON.me?m.p[1]:m.p[0]])return;rec={winner:ON.me,forfeit:true,doneAt:Date.now(),score:[0,0]}}
  else if(d.type==='rr')rec={void:true,doneAt:Date.now()};
  else{const s=d.order||[];const a=s.indexOf(m.p[0]),b=s.indexOf(m.p[1]);rec={winner:a<=b?m.p[0]:m.p[1],forfeit:true,seedAdvance:true,doneAt:Date.now(),score:[0,0]}}
  try{await ON.db.doc('tournaments/'+d.id).update({matches:{[mid]:rec}})}catch(e){TOUR.err='Couldn\'t record that. Try again.';render()}}
// called on a button press when a tournament match is decided, and between rounds
async function saveTourLog(d,winner,reason){if(!d||!d.tour)return;try{await ON.db.doc(`tournaments/${d.tour.tid}/logs/${d.tour.mid}-r${d.round}`).set({mid:d.tour.mid,round:d.round,attacker:d.attacker,siege:!!d.siege,seed:d.seed,armies:d.armies,placed:d.placed,actions:d.actions||[],players:d.seats,winner,reason,at:Date.now()})}catch(e){}}
async function reportTour(){const d=ON.d;if(!d||!d.tour||!G||!G.over)return;const w=M.score[0]>M.score[1]?0:1;
  await saveTourLog(d,G.over.winner,G.over.reason);
  try{await ON.db.doc('tournaments/'+d.tour.tid).update({matches:{[d.tour.mid]:{winner:d.seats[String(w)],score:[...M.score],doneAt:Date.now()}}})}catch(e){ON.err='Couldn\'t record the result. Try again.';render();return}
  backToTour()}
function backToTour(){chatStop();const tid=ON.tourBack;if(ON.unsub)ON.unsub();document.title=BASE_TITLE;Object.assign(ON,{active:false,code:null,side:null,ref:null,unsub:null,d:null,pending:false,placing:null,err:'',tourBack:null,spectate:false});M.score=[0,0];M.round=1;G=previewGame();openTour(tid)}
function tourAlert(){const d=TOUR.d;if(!d||!ON.me)return;const mine=allMatches(d).filter(m=>(m.status==='ready'||m.status==='live')&&m.p.includes(ON.me));
  const key=mine.map(m=>m.id+':'+Object.keys(m.rec.here||{}).length).join();const opWaiting=mine.some(m=>{const o=m.p[0]===ON.me?m.p[1]:m.p[0];return(m.rec.here||{})[o]});
  if(key&&key!==TOUR.alerted){chime();try{navigator.vibrate&&navigator.vibrate([90,60,90])}catch(e){}}TOUR.alerted=key;
  document.title=mine.length?(opWaiting?'● Opponent waiting · Vanquish':'● Your match is ready · Vanquish'):BASE_TITLE}

   <div class="row" style="margin-top:8px"><input id="tJoinCode" maxlength="5" placeholder="Code" autocapitalize="characters" style="width:7em;font-family:var(--f-data);letter-spacing:.15em;text-transform:uppercase;padding:8px"><button type="button" class="btn ghost" id="tJoinGo">Open</button></div></div></div>`}
function stBadge(m){const t={waiting:'Waiting',bye:'Bye',ready:'Ready',live:'Live',done:'Done',forfeit:'Forfeit',void:'Void'}[m.status];return `<span class="tst ${m.status}${overdue(m)?' late':''}">${overdue(m)?'Time up':t}</span>`}
function matchBox(d,m){const me=ON.me,mine=m.p.includes(me);const sc=m.rec.score;
  const row=(i)=>{const id=m.p[i];const won=m.winner!==undefined&&m.winner===id&&id;return `<div class="tm-p${won?' won':''}${id===me?' me':''}"><span>${id===null?'<i>bye</i>':id===undefined?'<i>TBD</i>':esc(tName(id))}</span>${sc&&m.status==='done'?`<b>${sc[i]}</b>`:''}</div>`};
  let act='';
  if((m.status==='ready'||m.status==='live')&&mine){const o=m.p[0]===me?m.p[1]:m.p[0],here=m.rec.here||{};
    act=`<button type="button" class="btn" data-tplay="${m.id}">${here[me]?'Rejoin match':'Play match'}</button>`;
    if(overdue(m)&&here[me]&&!here[o])act+=`<button type="button" class="btn ghost" data-tclaim="${m.id}:forfeit">Claim win (no-show)</button>`}
  else if(m.status==='live')act=`<button type="button" class="btn ghost" data-twatch="${m.id}">Watch live</button>`;
  if((m.status==='done')&&m.rec.room)act+=`<button type="button" class="btn ghost" data-trev="${m.id}">Review</button>`;

  const when=m.deadline&&m.status==='ready'?`<span class="tm-when">${Date.now()<m.deadline?`start within ${fmtLeft(m.deadline-Date.now())}`:'time is up'}</span>`:'';
  return `<div class="tm${mine?' mine':''}"><div class="tm-h"><span>${fmtBo(m.bo)}</span>${stBadge(m)}</div>${row(0)}${row(1)}${when}${act?`<div class="tm-a">${act}</div>`:''}</div>`}
function renderTour(){const d=TOUR.d;if(!d)return `<div class="panel cover"><h2>${TOUR.err?esc(TOUR.err):'Loading tournament…'}</h2><button type="button" class="btn ghost" id="tourBack">Back</button></div>`;
  const ids=Object.keys(d.players||{}).filter(k=>d.players[k]),me=ON.me,inIt=ids.includes(me),ch=champion(d);

function strengthBar(){if(!G)return '';const a=armyWeight(0),b=armyWeight(1),p=a+b?Math.round(100*a/(a+b)):50;
  return `<div class="sbar" role="img" aria-label="Army strength: Red ${p} percent, Blue ${100-p} percent"><span class="sb-l">Red ${p}%</span><div class="sb"><i style="width:${p}%"></i></div><span class="sb-r">${100-p}% Blue</span></div>`}
function chronLog(){const L=logItems.slice().reverse();return L.length?L.map((l,i)=>`<li class="s${l.side}"><span class="ln">${i+1}</span>${esc(l.text)}</li>`).join(''):'<li>The armies face each other.</li>'}

async function openReplay(mid){const d=TOUR.d;if(!d)return;const tid=d.id;closeTour();TOUR.rep={tid,mid,logs:null,idx:0,step:0,timer:null,err:''};phase='replay';render();
  try{const s=await ON.db.collection(`tournaments/${tid}/logs`).get();TOUR.rep.logs=s.docs.map(x=>x.data()).filter(x=>x&&x.mid===mid).sort((a,b)=>a.round-b.round);
    if(!TOUR.rep.logs.length)TOUR.rep.err='No saved rounds for this match.';else repLoad(0)}catch(e){TOUR.rep.err='Couldn\'t load the replay.'}render()}
function repGame(n){const R=TOUR.rep,L=R.logs[R.idx];const g=buildGame({...L,actions:(L.actions||[]).slice(0,n)});return g}
function repLoad(i){const R=TOUR.rep;R.idx=i;R.step=0;G=repGame(0)}
function repStep(n,anim){const R=TOUR.rep,L=R.logs[R.idx],max=(L.actions||[]).length;n=Math.max(0,Math.min(max,n));const vis=anim?visState():null;R.step=n;G=repGame(n);render();if(anim&&vis&&G.last)animate(vis,G.last,lastRolls)}
function repPlay(){const R=TOUR.rep;if(R.timer){clearInterval(R.timer);R.timer=null;render();return}
  R.timer=setInterval(()=>{const L=R.logs[R.idx];if(phase!=='replay'||R.step>=(L.actions||[]).length){clearInterval(R.timer);R.timer=null;render();return}repStep(R.step+1,true)},Math.round(1100*fxK()));render()}
function renderReplay(){const R=TOUR.rep;if(!R)return '';
  if(!R.logs||!R.logs.length)return `<div class="panel cover"><h2>${R.err?esc(R.err):'Loading replay…'}</h2><button type="button" class="btn ghost" id="repBack">Back to tournament</button></div>`;
  const L=R.logs[R.idx],max=(L.actions||[]).length;
  const head=`<div class="panel spec-h"><div class="row" style="justify-content:space-between;align-items:center"><div><span class="label">Replay · ${esc(tName(L.players&&L.players['0']))} (Red) vs ${esc(tName(L.players&&L.players['1']))} (Blue)</span><p class="hint">Round ${L.round}${L.winner!=null&&L.winner>=0?` · ${SIDE[L.winner]} won by ${esc(L.reason||'')}`:''}</p></div><button type="button" class="btn ghost" id="repBack">Back</button></div>
   ${R.logs.length>1?`<div class="seg" role="group" aria-label="Round">${R.logs.map((l,i)=>`<button type="button" data-repr="${i}" aria-pressed="${i===R.idx}">Round ${l.round}</button>`).join('')}</div>`:''}
   <div class="rep-ctl"><button type="button" class="tool" id="rpFirst" aria-label="Start">⏮</button><button type="button" class="tool" id="rpPrev" aria-label="Back one move">◀</button><button type="button" class="tool rp-play" id="rpPlay">${R.timer?'Pause':'Play'}</button><button type="button" class="tool" id="rpNext" aria-label="Forward one move">▶</button><button type="button" class="tool" id="rpLast" aria-label="End">⏭</button></div>
   <p class="note">Move ${R.step} of ${max}</p>${strengthBar()}</div>`;
  return `<div class="layout"><div>${boardHTML()}</div><div class="side">${head}<div class="panel"><span class="label">Battle log</span><ol class="log spec-log" id="specLog">${chronLog()}</ol></div></div></div>`}

function wireTour(on){
  on('openTours',()=>{openTours();loadNames([ON.me])});on('toursBack',()=>{phase='start';render()});
  document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{const[k,v]=b.dataset.tf.split(':');const nm=$('tName');if(nm)TOUR.form.name=nm.value;TOUR.form[k]=k==='size'?+v:v;if(TOUR.form.type==='rr'&&TOUR.form.size>8)TOUR.form.size=8;render()});
  on('tCreate',createTour);
  document.querySelectorAll('[data-tour]').forEach(b=>b.onclick=()=>openTour(b.dataset.tour));
  on('tJoinGo',()=>{const v=(($('tJoinCode')||{}).value||'').trim().toUpperCase();if(/^[A-Z0-9]{5}$/.test(v))openTour(v);else{TOUR.listErr='Tournament codes are 5 letters or numbers.';render()}});
  on('tourBack',()=>{closeTour();openTours()});on('tJoin',tourJoin);on('tLeave',tourLeave);on('tStart',tourStart);
  document.querySelectorAll('[data-tplay]').forEach(b=>b.onclick=()=>{b.disabled=true;tourPlay(b.dataset.tplay)});
  document.querySelectorAll('[data-twatch]').forEach(b=>b.onclick=()=>tourWatch(b.dataset.twatch));
  document.querySelectorAll('[data-trev]').forEach(b=>b.onclick=()=>openReplay(b.dataset.trev));
  document.querySelectorAll('[data-tclaim]').forEach(b=>b.onclick=()=>{const[mid,how]=b.dataset.tclaim.split(':');b.disabled=true;tourClaim(mid,how)});
  document.querySelectorAll('[data-set^="spec:"]').forEach(b=>b.onclick=()=>{TOUR.spec.text=b.dataset.set.endsWith(':text');render()});
  on('specBack',()=>{if(ON.tourBack)backToTour();else leaveRoom()});
  on('reportTour',()=>{const b=$('reportTour');if(b)b.disabled=true;reportTour()});on('backTour',backToTour);
  const sl=$('specLog');if(sl&&sl.scrollHeight)sl.scrollTop=sl.scrollHeight;
  if(TOUR.rep){on('repBack',()=>{const R=TOUR.rep;clearInterval(R.timer);TOUR.rep=null;G=previewGame();if(R.back==='profile'){phase='profile';render()}else openTour(R.tid)});
    on('rpFirst',()=>repStep(0));on('rpLast',()=>repStep(1e9));on('rpPrev',()=>repStep(TOUR.rep.step-1));on('rpNext',()=>repStep(TOUR.rep.step+1,true));on('rpPlay',repPlay);
    document.querySelectorAll('[data-repr]').forEach(b=>b.onclick=()=>{repLoad(+b.dataset.repr);render()})}
}

async function hostOpen(opts){if(!PL.me||!PL.me.tag){PL.editTag=true;render();return}const o=Object.assign({ranked:PL.host.ranked,stake:PL.host.stake,quick:false},opts||{});

function maybeSettle(d){if(!d||(!d.ranked&&!d.stake)||ON.side===null||!PL.me)return;const S=String(ON.side);if(d.settled&&d.settled[S])return;
  const need=winsNeeded();if(Math.max(...M.score)<need)return;const key=d.code+':'+d.mid;if(PL.settling[key])return;PL.settling[key]=true;
  const won=M.score[ON.side]>=need,opp=d.r?d.r[String(1-ON.side)]:1000,mine=d.r?d.r[S]:PL.me.rating;
  const p=PL.me,delta=d.ranked?Math.round(kFactor(p)*((won?1:0)-expected(mine||1000,opp||1000))):0;
  const crowns=(p.crowns||0)+ECON.played+(d.stake?(won?d.stake:-d.stake):0);
  const patch={crowns:Math.max(0,crowns),games:(p.games||0)+(d.ranked?1:0),w:(p.w||0)+(d.ranked&&won?1:0),l:(p.l||0)+(d.ranked&&!won?1:0)};
  if(d.ranked)patch.rating=Math.max(100,(p.rating||1000)+delta);
  PL.lastSettle={won,delta,stake:d.stake||0,earned:ECON.played,ranked:!!d.ranked};if(won&&d.ranked&&(opp||1000)-(mine||1000)>=100)grant('underdog');setTimeout(checkMetaAch,500);
  (async()=>{try{await savePlayer(patch);await ON.ref.update({settled:{[S]:true}})}catch(e){}if(phase==='over')render()})()}
function settleHTML(){const s=PL.lastSettle;if(!s||!ON.active)return '';const parts=[];
  if(s.ranked)parts.push(`${s.delta>=0?'+':''}${s.delta} rating (now ${Math.round(PL.me.rating)}, ${titleOf(PL.me.rating)})`);
  if(s.stake)parts.push(`${s.won?'+':'−'}${s.stake} crowns ${s.won?'won':'lost'}`);parts.push(`+${s.earned} crowns for playing`);
  return `<p class="settle">${parts.join(' · ')}</p>`}

const TUNE_MENU=[[7,1],[5,.5],[3,.5],[2,1],[0,1],[2,1.5],[3,.5],[5,1],[7,1],[10,1],[9,.5],[7,.5],[5,1],[3,1],[2,2],

const TUNE_WAR=[[0,.5],[0,.5],[7,1],[5,.5],[3,.5],[2,1],[null,1],[0,.5],[0,.5],[3,1],[2,.5],[0,.5],[-2,1],[null,1]];
const DRONE=[-12,-5];
const hz=st=>293.66*Math.pow(2,st/12);
function musBus(){if(!AC)return null;if(!MUS.bus){MUS.bus=AC.createGain();MUS.bus.gain.value=.0;MUS.bus.connect(AC.destination)}return MUS.bus}
function pluck(f,at,dur,vol){const o=AC.createOscillator(),o2=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2.003;lp.type='lowpass';lp.frequency.setValueAtTime(f*7,at);lp.frequency.exponentialRampToValueAtTime(f*1.4,at+.35);
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.006);g.gain.exponentialRampToValueAtTime(.0008,at+Math.min(1.6,dur*1.8));
  o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(musBus());o.start(at);o2.start(at);o.stop(at+2);o2.stop(at+2)}
function droneNote(f,at,dur,vol){const o=AC.createOscillator(),lp=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o.frequency.value=f;lp.type='lowpass';lp.frequency.value=380;
  g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(vol,at+.6);g.gain.setValueAtTime(vol,at+dur-.6);g.gain.linearRampToValueAtTime(0,at+dur);o.connect(lp);lp.connect(g);g.connect(musBus());o.start(at);o.stop(at+dur+.05)}
function drum(at,vol,low){const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(low?70:110,at);o.frequency.exponentialRampToValueAtTime(40,at+.25);
  g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(.001,at+.4);o.connect(g);g.connect(musBus());o.start(at);o.stop(at+.45);noiseBurst(at,.05,vol*.25,900)}
function startWind(){if(MUS.wind||!AC)return;const n=AC.sampleRate*4,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3}
  const s=AC.createBufferSource();s.buffer=b;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=.6;const g=AC.createGain();g.gain.value=0;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=260;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  s.connect(f);f.connect(g);g.connect(AC.destination);s.start();MUS.wind=s;MUS.windGain=g}
function musicMode(){if(['play','place','over','replay'].includes(phase))return 'war';return 'menu'}
function musicTick(){if(!AC||AC.state!=='running')return;const mode=musicMode(),wantMusic=SET.music&&SET.sound,wantAmb=SET.ambience&&SET.sound&&mode==='war';
  const bus=musBus();if(!bus)return;const now=AC.currentTime;
  bus.gain.setTargetAtTime(wantMusic?(mode==='war'?.05:.085):0,now,.6);
  if(wantAmb)startWind();if(MUS.windGain)MUS.windGain.gain.setTargetAtTime(wantAmb?.05:0,now,1.2);
  if(!wantMusic){MUS.next=0;return}
  if(mode!==MUS.mode){MUS.mode=mode;MUS.i=0;MUS.next=Math.max(MUS.next,now+.3)}
  if(MUS.next<now)MUS.next=now+.1;
  const tune=mode==='war'?TUNE_WAR:TUNE_MENU,beat=mode==='war'?.42:.5;
  while(MUS.next<now+1.2){const[st,b]=tune[MUS.i%tune.length];const at=MUS.next,dur=b*beat;
    if(MUS.i%tune.length===0)for(const d of DRONE)droneNote(hz(d),at,tune.reduce((s,n)=>s+n[1],0)*beat,mode==='war'?.05:.035);
    if(st!==null)pluck(hz(st)*(mode==='war'?.5:1),at,dur,mode==='war'?.16:.22);
    if(mode==='war'&&b>=1)drum(at,.35,true);else if(mode==='war'&&MUS.i%2===0)drum(at,.18,false);
    MUS.next+=dur;MUS.i++}}
function startMusic(){if(MUS.timer)return;MUS.timer=setInterval(musicTick,250)}

  const sk={};for(const e of kl)if(e.bs===side&&e.by&&T[e.by]&&T[e.by].siege)sk[e.by]=(sk[e.by]||0)+1;if(Object.values(sk).some(n=>n>=3))grant('artillery');

  const ds=[];for(let j=SHARE_SLOTS.length-1;j>=0;j--){ds[j]=v%4;v=Math.floor(v/4)}
  let sum=0;ds.forEach((d,j)=>sum+=d*(j+1));if(B32[sum%32]!==c[6])return {err:'That code doesn\'t check out. Look for a typo.'};
  const A={back:[...PRESETS.classic.back],front:[...PRESETS.classic.front]};A.back[4]='Cm';
  for(let j=0;j<SHARE_SLOTS.length;j++){const sl=SHARE_SLOTS[j],o=OPTS_BY[sl.c][ds[j]];if(!o)return {err:'That code doesn\'t make a legal army.'};A[sl.row][sl.i]=o}

    A.front.forEach((k,i)=>{if(!OPTS_BY.pawn.includes(k))errs.push(`Front row slot ${'abcdefgh'[i]} must be a Pawn: ${OPTS_BY.pawn.map(k=>T[k].name).join(', ')}.`)})}

  try{const g=newGame(['p0','p1'],['balanced','balanced'],{...RULES,clock:d.siege?40:0,defSide:1-d.attacker},d.attacker);
    for(const s of['0','1']){const pos=d.placed&&d.placed[s];if(!pos)continue;const mine=g.units.filter(u=>u.side===+s);mine.forEach(u=>{if(g.grid[ix(u.x,u.y)]===u)g.grid[ix(u.x,u.y)]=null});mine.forEach((u,k)=>{const q=pos[k];if(q){u.x=q[0];u.y=q[1]}g.grid[ix(u.x,u.y)]=u})}
    logItems=[];lastRolls=[];
    for(const a of d.actions||[]){if(g.over)break;ROLLS=[];CG=g;const U=x=>x>=0?g.units[x]:null;
      const ev=act(g,{u:g.units[a.u],i:a.i,moved:a.moved,mode:a.mode,t:U(a.t),heal:U(a.h),rally:U(a.r)});lastRolls=ROLLS;logItems.unshift({side:ev.side,text:ev.text});g._undo={side:ev.side,clean:!usedDice(ev,ROLLS)}}
    ROLLS=null;return g}finally{Math.random=saved;ROLLS=null}}
function derive(d){
  M.attacker=d.attacker;M.siege=d.siege;M.round=d.round;M.score=[...d.score];M.loser=d.loser;M.format=d.format||'bo3';M.armyRule=d.armyRule||'loser';M.campaign=null;
  const s=ON.side,S=s===null?null:String(s);
  if(!d.seats['1']){phase='lobby';render();return}
  if(phase==='lobby'&&ON.side===0)chime();
  if(d.rps&&!d.rps.done){ON.err='';phase='rps';render();return}
  if(!(d.armies['0']&&d.armies['1'])){
    if(S!==null&&d.locked['0']&&d.locked['1']&&!d.armies[S]&&ON.myArmy&&!ON.revealing){ON.revealing=true;ON.ref.update({armies:{[S]:{back:ON.myArmy.back,front:ON.myArmy.front}}}).catch(()=>{}).finally(()=>{ON.revealing=false})}
    if(S!==null&&!d.locked[S]){if(phase!=='build'){if(d.armies[S])M.players[s].army=clone(d.armies[S]);buildSide=s;phase='build'}}
    else phase='wait';
    render();return}
  const def=1-d.attacker;
  if(!d.placed[String(def)]||!d.placed[String(d.attacker)]){
    const placing=!d.placed[String(def)]?def:d.attacker,key=placing+':'+d.round;
    if(!(placing===s&&ON.placing===key)){G=buildGame(d);ON.placing=placing===s?key:null;ui.swap=null}
    placeQueue=[placing];phase='place';render();return}
  ON.placing=null;
  const sameRound=ON.animRound===d.round&&(phase==='play'||phase==='over')&&G&&G.log;
  const prevLen=sameRound?G.log.length:-1,vis=sameRound?visState():null,prevTurn=G?G.turn:0,wasPlaying=sameRound;
  G=buildGame(d);ui.sel=null;ui.dest=null;ui.mode=null;ui.confirm=null;ON.animRound=d.round;
  if(!G.over&&d.resign&&d.resign.round===d.round){G.over={winner:1-d.resign.seat,reason:`${SIDE[d.resign.seat]} resigned`}}
  if(G.over){const w=G.over.winner;if(w>=0){M.score[w]++;M.loser=1-w}else M.loser=null;phase='over';if(ON.side!==null){recordRound('online');loadH2H();maybeSettle(d);const ak=d.code+':'+d.mid+':'+d.round;if(ON.achKey!==ak){ON.achKey=ak;checkAchievements(ON.side,{})}takeHonor(d)}}else phase='play';
  if(vis&&G.log.length>prevLen){FX.prevVis=vis;FX.lastEv=G.last;FX.lastRolls=lastRolls}
  else if(!wasPlaying){FX.prevVis=null;FX.lastEv=null}
  render();
  if(vis&&G.log.length>prevLen)afterAction(vis,G.last,lastRolls,prevTurn);
  else if(!wasPlaying&&phase==='play'&&G.actions===0)roundBanner();
  turnAlert(phase==='play'&&isHumanTurn())}
async function onlineLock(){const s=ON.side,army=clone(M.players[s].army);ON.myArmy=army;
  try{await ON.db.doc('data/users/'+ON.me+'/army-'+ON.code).set({back:army.back,front:army.front,round:M.round})}catch(e){}
  phase='wait';render();
  try{await ON.ref.update({locked:{[String(s)]:true}})}catch(e){ON.err='Couldn\'t lock in. Try again.';phase='build';render()}}
async function onlinePlaced(){const s=ON.side,pos=G.units.filter(u=>u.side===s).map(u=>[u.x,u.y]);ON.placing=null;
  try{await ON.ref.update({placed:{[String(s)]:pos}})}catch(e){ON.err='Couldn\'t save your setup. Try again.';render()}}

async function onlineNextRound(){const d=ON.d;if(!d||!G||!G.over)return;if(d.tour)await saveTourLog(d,G.over.winner,G.over.reason);const w=G.over.winner,r=d.round+1,score=[...d.score];if(w>=0)score[w]++;
  const keep=w>=0?String(w):null,lose=w>=0?String(1-w):null,rule=d.armyRule||'loser',kp=k=>rule==='locked'||(rule==='loser'&&keep===k);
  const nd={...d,round:r,attacker:1-d.attacker,score,loser:w>=0?1-w:null,
    locked:{'0':kp('0'),'1':kp('1')},armies:{'0':kp('0')?d.armies['0']:null,'1':kp('1')?d.armies['1']:null},

async function onlineRematch(){const d=ON.d;if(!d)return;try{await ON.ref.set(freshDoc(d.code,d.seats,d.attacker,d.siege,{format:d.format,armyRule:d.armyRule,rps:!!d.rps}))}catch(e){ON.err='Couldn\'t start a rematch.';render()}}

let lastRecordId=null,noteSaved=false;
function recordId(){const mid=ON.active?((ON.d&&ON.d.mid)||ON.code):(M.mid||'L');return `${mid}-r${M.round}`}
function armyOf(s){return ON.active&&ON.d?ON.d.armies[String(s)]:M.players[s].army}
async function recordRound(mode){
